    var pw = pwEl.value;
    if (!pw) { pwEl.focus(); return; }
    err.classList.remove("show");
    busy(true);
    decryptWith(pw).then(function (html) {
      reveal(html, pw);
    }).catch(function () {
      busy(false);
      err.classList.add("show");
      pwEl.value = "";
      pwEl.focus();
    });
  });

  var stored = null;
  try { stored = sessionStorage.getItem(STORE_KEY); } catch (e) { stored = null; }
  if (stored) {
    busy(true);
    decryptWith(stored).then(function (html) {
      reveal(html, stored);
    }).catch(function () {
      try { sessionStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
      busy(false);
      pwEl.focus();
    });
  }
})();
</script>
</body>
</html>
