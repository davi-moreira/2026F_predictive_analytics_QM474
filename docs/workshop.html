    form.parentNode.removeChild(form);
    note.textContent = "This page needs a secure connection to unlock. Open it over https and try again.";
    return;
  }

  function decryptWith(pw) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function (material) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: bytes(D.salt), iterations: D.iterations, hash: "SHA-256" },
          material,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(D.iv) }, key, bytes(D.ct));
      })
      .then(function (buf) {
        return new TextDecoder("utf-8").decode(buf);
      });
  }

  function reveal(html, pw) {
    try { sessionStorage.setItem(STORE_KEY, pw); } catch (e) { /* private mode */ }
    document.open();
    document.write(html);
    document.close();
  }

  function busy(on) {
    btn.disabled = on;
    btn.textContent = on ? "Unlocking..." : "Unlock";
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = pwEl.value;
    if (!pw) { pwEl.focus(); return; }
    err.classList.remove("show");
    busy(true);
    decryptWith(pw).then(function (html) {
      reveal(html, pw);
    }).catch(function () {
      busy(false);
      err.classList.add("show");
      pwEl.value = "";
      pwEl.focus();
    });
  });

  var stored = null;
  try { stored = sessionStorage.getItem(STORE_KEY); } catch (e) { stored = null; }
  if (stored) {
    busy(true);
    decryptWith(stored).then(function (html) {
      reveal(html, stored);
    }).catch(function () {
      try { sessionStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
      busy(false);
      pwEl.focus();
    });
  }
})();
</script>
</body>
</html>
